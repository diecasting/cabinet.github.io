{{ define "main" }}
<article class="page">
  <div class="container">
    <header class="page-header">
      <h1>{{ .Title }}</h1>
      {{ with .Params.description }}<p class="lead">{{ . | markdownify }}</p>{{ end }}
    </header>
    <div class="page-body">
      {{ .Content }}
    </div>

    {{ with .Params.faq }}
    <section class="faq" aria-label="FAQ">
      <h2>FAQ</h2>
      {{ range . }}
      <div class="faq-item">
        <h3>{{ .q }}</h3>
        <p>{{ .a | markdownify }}</p>
      </div>
      {{ end }}
    </section>
    {{ end }}

    {{ if .Params.form }}{{ partial "contact-form.html" . }}{{ end }}
  </div>
</article>
{{ end }}
