{{ define "main" }}
<section class="section">
  <div class="container">
    <header class="page-header">
      <h1>{{ .Title }}</h1>
      {{ with .Content }}<div class="page-body">{{ . }}</div>{{ end }}
    </header>

    {{ if .Pages }}
    <div class="card-grid">
      {{ range .Pages }}
      <article class="card">
        {{ with .Params.image }}<img src="{{ . | relURL }}" alt="{{ $.Title }} — {{ . }}" title="{{ . }}" width="320" height="220" loading="lazy">{{ end }}
        <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
        {{ with .Params.description }}<p>{{ . }}</p>{{ end }}
      </article>
      {{ end }}
    </div>
    {{ end }}
  </div>
</section>
{{ end }}
